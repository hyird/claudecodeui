name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # proto/messages.js and messages.d.ts are generated but committed; fail if
      # they no longer match proto/messages.proto.
      - name: Check generated protobuf code
        run: npm run proto && git diff --exit-code proto

      # Must precede the tests: the SPA-fallback and compression suites assert
      # against a real dist/.
      - name: Build
        run: npm run build

      # Runs the spec type-check, the node:test suites and Vitest; all three
      # report even when an earlier one fails.
      - name: Test
        run: npm test

      - name: Report artifact sizes
        run: |
          echo "server bundle: $(du -h dist-server/server.js | cut -f1)"
          echo "frontend:      $(du -h dist/index.html | cut -f1)"
          echo "gzipped:       $(gzip -c dist/index.html | wc -c) bytes"
